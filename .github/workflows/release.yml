# Compila AmazonSniper.exe en Windows y lo publica como Release cuando cambia
# APP_VERSION (sniper/config.py). La app instalada detecta la Release nueva y se
# actualiza sola.
name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Leer versión
        run: |
          VER=$(python -c "from sniper.config import APP_VERSION; print(APP_VERSION)")
          echo "VER=$VER" >> "$GITHUB_ENV"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "EXISTS=1" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compilar AmazonSniper.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name AmazonSniper \
            --collect-all customtkinter --collect-data certifi \
            --hidden-import lxml.etree --hidden-import playwright.async_api \
            main.py
          ls -la dist

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AmazonSniper-${{ env.VER }}
          path: dist/AmazonSniper.exe

      - name: Publicar Release
        if: env.EXISTS != '1'
        run: |
          gh release create "v$VER" dist/AmazonSniper.exe \
            --title "Amazon Sniper v$VER" \
            --notes "Descarga AmazonSniper.exe, ponlo en una carpeta (no en el Escritorio) y ábrelo. Si ya lo tienes, la app te ofrecerá actualizarse sola."
        env:
          GH_TOKEN: ${{ github.token }}
